<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="M1_998 — Indie Developer">
  <defs>
    <radialGradient id="fade" cx="50%" cy="44%" r="64%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="mask-dots">
      <rect width="1200" height="340" fill="url(#fade)"/>
    </mask>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a2a2a"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#2e2e2e"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="26" fill="#0a0a0a"/>
  <rect width="1200" height="340" rx="26" fill="url(#dots)" mask="url(#mask-dots)"/>

  <g transform="translate(480,50)">
    <rect x="0.5" y="0.5" width="239" height="29" rx="14.5" fill="#080808" stroke="#1e1e1e"/>
    <circle cx="21" cy="15" r="3" fill="#3ddc84"/>
    <text x="34" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" letter-spacing="2.1" fill="#7d7d7d">OPEN FOR COLLABORATION</text>
  </g>

  <text x="600" y="204" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="108" font-weight="700" letter-spacing="-5.2" fill="#ffffff">M1_998</text>

  <text x="600" y="250" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="18.5" font-weight="400" letter-spacing="0.4" fill="#8f8f8f">Indie Developer · Turning ideas into products</text>

  <rect x="480" y="300" width="240" height="1" fill="url(#rule)"/>
</svg>
