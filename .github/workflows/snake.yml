name: Generate Snake

on:
  # 每 8 小时自动跑一次
  schedule:
    - cron: "0 */8 * * *"
  # 允许在 Actions 页面手动触发（第一次请手动点一次）
  workflow_dispatch:
  # 每次往主分支推代码也会顺带刷新
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # 两个版本：浅色主题用深色蛇，深色主题用白色蛇
          outputs: |
            dist/snake.svg?color_snake=#111111&color_dots=#efefef,#c9c9c9,#8f8f8f,#4a4a4a,#111111
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#151515,#2a2a2a,#4a4a4a,#8a8a8a,#ffffff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
